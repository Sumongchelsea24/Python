<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Index Page</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      table,
      th,
      td {
        border: 1px solid red;
      }
    </style>
  </head>
  <body>
    <h1>This is Employee Table</h1>
    {%if emp_list%}
    <table>
      <thead>
        <tr>
          <th>Employee Id</th>
          <th>Employee Number</th>
          <th>Employee Name</th>
          <th>Employee Salary</th>
          <th>Employee Address</th>
        </tr>
      </thead>
      <tbody>
        {% for emp in emp_list %}
        <tr>
          <td>{{ emp.id }}</td>
          <td>{{ emp.eno }}</td>
          <td>{{ emp.ename }}</td>
          <td>{{ emp.esal }}</td>
          <td>{{ emp.eaddr }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% else %}
    <p>No data found</p>
    {% endif %}
  </body>
</html>
